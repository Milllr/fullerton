<!doctype html>
<html lang="en-CA" class="no-js">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fullerton Productions, James Downey, Lighting Designer</title>
    <meta
      name="description"
      content="Fullerton Productions is the Toronto lighting design company of James Downey: Sportsnet Studios, Breakfast Television, Super Bowl XLIV, the MuchMusic Video Awards and more."
    />
    <meta name="theme-color" content="#e4dfd6" />
    <meta property="og:title" content="Fullerton Productions" />
    <meta property="og:description" content="James Downey, Lighting Designer. Toronto." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://fullertonproductions.ca/og.jpg" />
    <meta property="og:url" content="https://fullertonproductions.ca/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      document.documentElement.classList.replace('no-js', 'js');
    </script>
  </head>
  <body>
    <a class="skip" href="#work">Skip to work</a>

    <canvas class="field" id="field" aria-hidden="true"></canvas>

    <header class="chrome">
      <a class="brand" href="#top" aria-label="Fullerton Productions, back to top"><span class="brand-mark" id="brand-mark"></span><span class="brand-name">Fullerton Productions</span></a>
      <nav class="nav" aria-label="Sections">
        <a href="#work">Work</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>
    <div class="marks" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <canvas class="cable" id="cable" aria-hidden="true"></canvas>

    <main id="main">
      <section class="cover" id="top" aria-labelledby="name">
        <div class="cover-type">
          <h1 class="name" id="name">James Downey</h1>
          <p class="role">Lighting Designer</p>
          <p class="place">Toronto</p>
        </div>
        <a class="cover-index" href="#work"><span>Work</span><span class="cover-count" id="cover-count"></span><span aria-hidden="true">↓</span></a>
        <ul class="cover-nets" id="cover-nets" aria-label="Networks and clients"></ul>
      </section>

      <section class="work" id="work" aria-labelledby="work-title">
        <header class="sec-head">
          <h2 class="sec-title" id="work-title">Work</h2>
          <p class="sec-count" id="work-count"></p>
        </header>
        <div class="showcase" id="showcase"></div>
        <div class="all-work" id="all-work">
          <header class="sec-head">
            <h3 class="sec-title">All work</h3>
            <p class="sec-count" id="all-count"></p>
          </header>
          <div id="all-list"></div>
        </div>
      </section>

      <section class="contact" id="contact" aria-labelledby="contact-title">
        <header class="sec-head">
          <h2 class="sec-title" id="contact-title">Contact</h2>
        </header>
        <div class="contact-logo" id="contact-logo" aria-hidden="true"></div>
        <div class="contact-body" id="contact-body"></div>
      </section>
    </main>

    <footer class="foot" id="foot"></footer>

    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
